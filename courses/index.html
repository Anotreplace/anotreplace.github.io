@import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&display=swap');

/* Layout : un « tableau de départ » en tête (compte à rebours), puis une grille de dossards. */
:root {
  --bleu: #5170FF; --violet: #A46BE2; --rose: #F266C8;
  --grad: linear-gradient(90deg, #5170FF, #A46BE2, #EE66C9);
  --bg: #FBFAFF; --surface: #FFFFFF; --lavande: #F2EFFD;
  --ink: #221C47; --muted: #5F5A7D; --line: #E4DEF8;
  --accent: #6B4FD8; --accent-ink: #FFFFFF;
  --board: #221C47; --board-ink: #FFFFFF; --board-muted: #C9C2F0;
  --tri: #4361F0; --run: #D23FA8; --trail: #1E8A78; --bike: #8A55D6; --hyb: #B4560B;
  --ok: #15845A; --ok-bg: #E3F6EC; --warn: #9A6200; --warn-bg: #FDF1D8;
  --hot: #D3263F; --hot-bg: #FDE6EA; --idle: #5F5A7D; --idle-bg: #EFEDF7;
  --shadow: 0 1px 2px rgba(34,28,71,.06), 0 8px 24px -12px rgba(34,28,71,.18);
  --font: "Josefin Sans", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #110E24; --surface: #1B1736; --lavande: #241F45;
  --ink: #F2EFFD; --muted: #ABA4CF; --line: #312B5A;
  --accent: #9C86FF; --accent-ink: #110E24;
  --board: #241F45; --board-ink: #FFFFFF; --board-muted: #B9B0EA;
  --tri: #7F95FF; --run: #F57DD2; --trail: #4CC6AF; --bike: #B994F2; --hyb: #F2A350;
  --ok: #5FD39B; --ok-bg: #133325; --warn: #F2B95A; --warn-bg: #352812;
  --hot: #FF7A8C; --hot-bg: #3A1520; --idle: #ABA4CF; --idle-bg: #262148;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #110E24; --surface: #1B1736; --lavande: #241F45;
  --ink: #F2EFFD; --muted: #ABA4CF; --line: #312B5A;
  --accent: #9C86FF; --accent-ink: #110E24;
  --board: #241F45; --board-ink: #FFFFFF; --board-muted: #B9B0EA;
  --tri: #7F95FF; --run: #F57DD2; --trail: #4CC6AF; --bike: #B994F2; --hyb: #F2A350;
  --ok: #5FD39B; --ok-bg: #133325; --warn: #F2B95A; --warn-bg: #352812;
  --hot: #FF7A8C; --hot-bg: #3A1520; --idle: #ABA4CF; --idle-bg: #262148;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); margin: 0; }
.anp { font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg); min-height: 100vh; -webkit-font-smoothing: antialiased; }
.anp *, .anp *::before, .anp *::after { box-sizing: border-box; }
:where(.anp) :where(button, input, select, textarea) { font: inherit; color: inherit; }
.anp h1, .anp h2, .anp h3, .anp h4 { margin: 0; line-height: 1.15; text-wrap: balance; }
.anp :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.anp svg { flex-shrink: 0; }

/* Barre du haut */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar::before { content: ""; display: block; height: 4px; background: var(--grad); }
.topbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 24px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; line-height: 1; gap: 12px; }
.brand-sub { max-width: 9em; line-height: 1.25; }
.logo { display: block; height: 48px; width: auto; }
.wordmark { font-weight: 700; font-size: 22px; letter-spacing: .02em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wordmark em { font-family: var(--num); font-weight: 600; font-style: italic; letter-spacing: .04em; }
.brand-sub { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.desk-nav { display: none; gap: 4px; margin-left: 16px; }
.desk-nav button { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.desk-nav button:hover { background: var(--lavande); color: var(--ink); }
.desk-nav button.is-on { background: var(--lavande); color: var(--ink); }
.desk-actions { display: none; gap: 8px; margin-left: auto; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-soft { background: var(--lavande); color: var(--ink); border-color: var(--line); }
.btn-soft:hover { border-color: var(--accent); }
.btn-light { background: #FFFFFF; color: #221C47; }
.btn-outline-light { background: transparent; color: var(--board-ink); border-color: rgba(255,255,255,.35); }
.btn-outline-light:hover { border-color: #FFFFFF; }
.btn-danger { background: var(--hot); color: #FFFFFF; }
.danger-text { color: var(--hot); }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--accent); }
.icon-btn.ghost { border-color: transparent; background: transparent; }
.icon-btn.sm { width: 44px; height: 44px; }
.link-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px 4px; min-height: 44px; }
.link-btn.danger { color: var(--hot); }

/* Contenu */
.main { max-width: 1240px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 48px 0; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero : tableau de départ */
.hero { display: grid; gap: 16px; }
.board { position: relative; overflow: hidden; background: var(--board); color: var(--board-ink); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.board::after { content: ""; position: absolute; inset: auto -10% -60% 30%; height: 120%; background: radial-gradient(closest-side, rgba(164,107,226,.45), transparent); pointer-events: none; }
.board::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--grad); }
.board > * { position: relative; z-index: 1; }
.board-eyebrow { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--board-muted); }
.board h1 { font-size: clamp(26px, 5vw, 40px); font-weight: 700; }
.board-sub { margin: 0; color: var(--board-muted); }
.board-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

.countdown { display: flex; gap: 8px; font-family: var(--num); font-variant-numeric: tabular-nums; }
.cd-cell { display: flex; align-items: baseline; gap: 3px; background: var(--lavande); border-radius: 10px; padding: 6px 10px; min-width: 56px; justify-content: center; }
.cd-val { font-size: 26px; font-weight: 700; line-height: 1; }
.cd-unit { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.countdown-lg { gap: 10px; margin-top: 6px; }
.countdown-lg .cd-cell { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); padding: 10px 12px; min-width: 0; flex: 1; max-width: 120px; }
.countdown-lg .cd-val { font-size: clamp(34px, 8vw, 56px); color: #FFFFFF; }
.countdown-lg .cd-unit { color: var(--board-muted); }

.kpis { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi dt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi dd { margin: 0; font-family: var(--num); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi dd small { font-size: 18px; color: var(--muted); font-weight: 600; }

.mode-note { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--muted); background: var(--lavande); border-radius: 12px; padding: 10px 14px; }

/* Barre d'outils */
.toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; min-height: 48px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 12px 0; color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; color: var(--muted); }
.chip span { font-family: var(--num); font-size: 14px; background: var(--lavande); border-radius: 999px; padding: 0 7px; color: var(--ink); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.is-on span { background: rgba(255,255,255,.18); color: inherit; }
.chip.tone-tri svg { color: var(--tri); } .chip.tone-run svg { color: var(--run); } .chip.tone-trail svg { color: var(--trail); } .chip.tone-bike svg { color: var(--bike); } .chip.tone-hyb svg { color: var(--hyb); }
.chip.is-on svg { color: inherit; }

/* Cartes dossards */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.bib { --tone: var(--tri); position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.bib::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: var(--tone); }
.tone-tri { --tone: var(--tri); } .tone-run { --tone: var(--run); } .tone-trail { --tone: var(--trail); } .tone-bike { --tone: var(--bike); } .tone-hyb { --tone: var(--hyb); }
.pin { position: absolute; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(34,28,71,.35); }
.pin-tl { left: 10px; } .pin-tr { right: 10px; }
.bib.status-today { border-color: var(--hot); box-shadow: 0 0 0 3px var(--hot-bg), var(--shadow); }
.bib-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-inline: 8px; }
.disc { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tone); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.pill-veille { background: var(--idle-bg); color: var(--idle); }
.pill-avenir { background: var(--warn-bg); color: var(--warn); }
.pill-today { background: var(--hot-bg); color: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
.pill-open { background: var(--ok-bg); color: var(--ok); }
.pill-done { background: var(--idle-bg); color: var(--idle); }
.bib.status-done { opacity: .78; box-shadow: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; opacity: .82; } }
.bib-title { display: flex; align-items: flex-start; gap: 8px; }
.bib-title-text { flex: 1; min-width: 0; }
.bib h3 { font-size: 22px; font-weight: 700; }
.format { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 14px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.example-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }
.opening { background: var(--lavande); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.opening-label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.opening-label::first-letter { text-transform: uppercase; }
.opening .cd-cell { background: var(--surface); flex: 1; min-width: 0; }
.opening-note { margin: 0; font-size: 14px; color: var(--muted); }
.race-note { margin: 0; display: flex; gap: 6px; align-items: flex-start; font-size: 14px; font-weight: 600; color: var(--warn); }
.race-note svg { margin-top: 3px; }
.meta-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; text-decoration: none; min-height: 32px; }
.meta-link:hover { text-decoration: underline; }
.has-dot { position: relative; }
.has-dot::after { content: ""; position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 2px var(--lavande); }
.announce { background: var(--hot-bg); border: 1px solid color-mix(in srgb, var(--hot) 35%, transparent); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.announce-title { margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--hot); }
.announce ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.announce li { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border-radius: 12px; padding: 8px 8px 8px 14px; }
.announce li span { min-width: 0; }
.privacy { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.privacy svg { margin-top: 2px; }
.form-group { border-top: 1px solid var(--line); padding-top: 14px; gap: 12px; }
.field-row-3 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) !important; gap: 10px; }
.message { display: flex; flex-direction: column; gap: 14px; }
.message textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 12px 14px; line-height: 1.5; resize: vertical; }
.message textarea:focus { outline: none; border-color: var(--accent); }
.stats { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
.stats > div { border-left: 2px solid var(--line); padding-left: 10px; min-width: 0; }
.stats dt { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats dd { margin: 2px 0 0; font-family: var(--num); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 16px; color: var(--muted); }
.card-actions { display: flex; gap: 8px; }
.card-actions .btn-primary { flex: 1; min-width: 0; padding-inline: 12px; }
.card-actions .btn-soft { padding-inline: 12px; }
@media (max-width: 420px) { .hide-sm { display: none; } .card-actions .btn-primary { font-size: 15px; gap: 6px; } }
.members-toggle { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; min-height: 44px; }
.members-toggle .rot { transform: rotate(90deg); }
.members-toggle svg { transition: transform .2s ease; }
.avatars { display: flex; }
.avatars .avatar { margin-left: -8px; border: 2px solid var(--surface); }
.avatars .avatar:first-child { margin-left: 0; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--grad); color: #FFFFFF; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.member { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px; padding: 6px 0; }
.member-main { min-width: 0; display: flex; flex-direction: column; }
@media (max-width: 420px) { .member { grid-template-columns: auto minmax(0, 1fr) auto; } .member .status-toggle { grid-column: 2; grid-row: 2; justify-self: start; } }
.member-main strong { font-weight: 600; }
.member-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); background: none; border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px; min-height: 44px; cursor: pointer; }
.tag-btn:disabled, .status-toggle:disabled { cursor: default; border-style: solid; opacity: .85; }
.tag-btn:disabled:hover, .status-toggle:disabled:hover { border-color: var(--line); color: var(--muted); }
.tag-static { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ok); padding: 6px 4px; min-height: 44px; }
.me-tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-left: 4px; }
.tag-btn:hover { border-color: var(--accent); color: var(--ink); }
.tag-btn.is-missing { color: var(--warn); border-color: currentColor; }
.status-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--warn); }
.status-toggle:hover { border-color: var(--accent); }
.status-toggle.is-bib { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.confirm { display: inline-flex; gap: 4px; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--line); border-radius: 20px; }
.empty p { margin: 0; }

/* Agenda fédéral */
.federal .toolbar { flex-direction: column; align-items: stretch; }
.fed-count { margin: 0 0 4px; color: var(--muted); font-size: 14px; font-weight: 600; }
.fed-months { display: flex; flex-direction: column; gap: 20px; }
.fed-month-title { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.fed-month-title::first-letter { text-transform: uppercase; }
.fed-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.fed-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px 14px; padding: 14px 16px; align-items: center; }
.fed-row + .fed-row { border-top: 1px solid var(--line); }
.fed-row.is-cancelled strong { text-decoration: line-through; color: var(--muted); }
.fed-date { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--lavande); border-radius: 12px; padding: 6px 0; font-family: var(--num); line-height: 1; }
.fed-day { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fed-wd { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.fed-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fed-main strong { font-weight: 700; }
.fed-place { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.fed-formats { display: flex; flex-wrap: wrap; gap: 4px; }
.fmt { font-family: var(--num); font-size: 13px; font-weight: 600; letter-spacing: .03em; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.fed-actions { grid-column: 2; display: flex; gap: 8px; }
.fed-actions .btn { min-height: 44px; padding: 8px 12px; }
.is-followed { color: var(--ok); }
.fed-sources { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.fed-sources > p { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.fed-sources a { color: var(--accent); }
.ffa-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; background: var(--lavande); border-radius: 16px; padding: 16px; }
.ffa-card > svg { color: var(--run); margin-top: 2px; }
.ffa-card p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.ffa-card .btn { grid-column: 2; justify-self: start; }
@media (min-width: 640px) {
  .fed-row { grid-template-columns: 56px minmax(0, 1fr) auto; }
  .fed-actions { grid-column: 3; }
  .ffa-card { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; }
  .ffa-card .btn { grid-column: 3; }
}

/* Logistique */
.seat-line { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; border-radius: 12px; padding: 8px 12px; }
.seat-line svg { margin-top: 2px; flex-shrink: 0; }
.seat-line.is-ok { background: var(--ok-bg); color: var(--ok); }
.seat-line.is-short { background: var(--warn-bg); color: var(--warn); }
.li-meta { color: var(--muted); font-size: 14px; }
.section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
.section-head h2 { font-size: 26px; }
.section-head p { margin: 0; color: var(--muted); }
.logi-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.logi { --tone: var(--tri); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.logi header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.logi h3 { display: flex; align-items: center; gap: 8px; font-size: 19px; }
.logi h3 svg { color: var(--tone); }
.logi header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.progress { height: 8px; border-radius: 999px; background: var(--lavande); overflow: hidden; }
.progress-bar { height: 100%; background: var(--grad); border-radius: inherit; transition: width .3s ease; }
.progress-label { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.logi-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.logi-cols h4 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.logi-cols ul { margin: 0; padding-left: 18px; font-size: 15px; }
.empty-line { margin: 0; color: var(--muted); font-size: 14px; font-style: italic; }
.logi .link-btn { align-self: flex-start; }

.foot-user { display: block; font-style: normal; margin-top: 4px; }
.login { max-width: 440px; width: 100%; margin: 24px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.login-logo { height: 72px; width: auto; align-self: center; }
.login h1 { font-size: 24px; text-align: center; }
.login > p { margin: 0; color: var(--muted); text-align: center; }
.login .code-input { font-family: var(--num); font-size: 30px; letter-spacing: .4em; text-align: center; }
.login-info { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ok); background: var(--ok-bg); border-radius: 12px; padding: 10px 12px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; font-style: italic; padding-top: 8px; }

/* Navigation mobile */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 10px 4px 8px; min-height: 60px; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600; }
.bottom-nav button.is-on { color: var(--accent); }
.bottom-nav button:disabled { opacity: .4; }
.fab { position: fixed; z-index: 26; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--surface); background: var(--grad); color: #FFFFFF; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 24px -8px rgba(107,79,216,.7); }
.fab:active { transform: translateX(-50%) scale(.94); }

/* Feuilles (bottom sheet mobile, modale bureau) */
.sheet-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(17,14,36,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-height: 92vh; background: var(--surface); color: var(--ink); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: up .24s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-grip { width: 44px; height: 5px; border-radius: 999px; background: var(--line); margin: 10px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px 6px; }
.sheet-head h2 { font-size: 21px; }
.sheet-body { overflow-y: auto; padding: 8px 20px 20px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.drawer { display: flex; flex-direction: column; gap: 8px; }
.drawer button { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; min-height: 64px; cursor: pointer; }
.drawer button:hover { border-color: var(--accent); }
.drawer button:disabled { opacity: .45; }
.drawer button > svg { color: var(--accent); }
.drawer span { display: flex; flex-direction: column; }
.drawer small { color: var(--muted); font-size: 13px; }

/* Formulaires */
.form { display: flex; flex-direction: column; gap: 16px; }
.form-intro { margin: 0; background: var(--lavande); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); }
.form-intro strong { color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 6px; }
.field input { min-height: 48px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px; width: 100%; }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field input:disabled { opacity: .5; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.field-error { color: var(--hot); font-size: 14px; font-style: normal; font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { position: relative; display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; font-weight: 600; font-size: 15px; min-height: 104px; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice svg { color: var(--muted); }
.choice.is-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.choice.is-on svg { color: var(--accent); }
.choice:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-item { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; font-weight: 600; }
.seg-item input { position: absolute; opacity: 0; pointer-events: none; }
.seg-item svg { color: var(--tone, var(--accent)); }
.seg-item.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg-item.is-on svg { color: inherit; }
.seg-item:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding-top: 4px; }
.form-actions .spacer { flex: 1; }
.form-actions .btn-primary { flex: 1 1 180px; }

/* ICS */
.ics { display: flex; flex-direction: column; gap: 16px; }
.ics-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
.ics-list li { display: flex; gap: 10px; align-items: flex-start; }
.ics-list svg { color: var(--accent); margin-top: 3px; }
.ics-list small { color: var(--muted); }
.ics-list small::first-letter { text-transform: uppercase; }
.alarms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.alarms div { display: flex; gap: 8px; align-items: flex-start; background: var(--lavande); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.alarms svg { color: var(--accent); margin-top: 2px; }
.alarms strong { font-family: var(--num); font-size: 18px; margin-right: 4px; }
.ics-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ics-actions .btn-primary { flex: 1 1 200px; }
.hint { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.hint svg { margin-top: 2px; }
.ics-raw summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.ics-raw textarea { width: 100%; margin-top: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px; resize: vertical; }

/* Guide */
.guide { display: flex; flex-direction: column; gap: 16px; }
.guide-lead { margin: 0; max-width: 62ch; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); }
.flow span { display: inline-flex; align-items: center; gap: 6px; background: var(--lavande); color: var(--ink); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.flow span svg { color: var(--accent); }
.seg-tabs .seg-item { min-width: 96px; justify-content: center; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: step; position: relative; padding-left: 44px; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--grad); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.steps p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.code-block { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 12px; background: var(--lavande); font-size: 13px; font-weight: 600; }
.code-block pre { margin: 0; padding: 12px; overflow-x: auto; font-size: 13px; background: var(--bg); }

/* Toast */
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); animation: up .2s ease; }
.toast button { border: 0; background: none; color: var(--bg); text-decoration: underline; font-weight: 700; cursor: pointer; white-space: nowrap; padding: 6px 0; }

@media (min-width: 640px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .search { flex: 1 1 280px; }
  .chips { margin-right: 0; padding-right: 0; flex-wrap: wrap; overflow: visible; }

  .sheet { max-width: 560px; border-radius: 24px; animation-name: fade; }

  .sheet-grip { display: none; }
  .sheet-head { padding-top: 18px; }
}
@media (min-width: 960px) {
  .desk-nav { display: flex; }
  .bottom-nav { display: none; }
  .fab { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .main { padding-bottom: 48px; }
  .hero { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: stretch; }
  .board { padding: 32px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { justify-content: space-between; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .logi-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toast { bottom: 32px; }
}
@media (min-width: 1180px) {
  .desk-actions { display: flex; }
  .fab { display: none; }
}
@media (prefers-reduced-motion: reduce) {
