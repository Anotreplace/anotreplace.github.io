# Une seule source pour la FAQ : la page /faq/, l'accueil (questions "accueil: true")
# et les données structurées Google sont générées à partir de ce fichier.
- groupe: La pratique
  id: pratique
  questions:
    - q: Je débute, j'ai le niveau ?
      r: Oui. Les groupes se font par allure et personne ne reste derrière.
      accueil: true
    - q: Je fais surtout du vélo ou de la natation.
      r: Bienvenue. Le triathlon et les sorties vélo font partie du collectif.
    - q: Je n'ai pas beaucoup de temps.
      r: Aucune présence n'est obligatoire. Tu viens quand tu peux.
    - q: C'est un club de compétition ?
      r: Non. On aime les défis, sans pression ni comparaison.
      accueil: true
    - q: Qui anime les sorties ?
      r: Des adhérentes bénévoles. Les séances techniques sont confiées à des coachs diplômées.
- groupe: La sécurité
  id: securite
  questions:
    - q: Est-ce que je cours en sécurité le soir ?
      r: Oui. Binômes, parcours éclairés, retour groupé, toujours.
      accueil: true
    - q: Pourquoi les lieux de rendez-vous ne sont-ils pas publiés ?
      r: Pour ta sécurité. Ils sont envoyés par e-mail après ta réservation.
    - q: Que se passe-t-il en cas de comportement déplacé ?
      r: Une référente t'écoute en toute confidentialité, comme le prévoit notre charte.
- groupe: L'adhésion
  id: adhesion
  questions:
    - q: Combien ça coûte ?
      r: 60 € par an, ou 30 € en tarif solidaire. La première séance est offerte.
      accueil: true
    - q: Et si je n'accroche pas ?
      r: Tu adhères seulement si tu as aimé ta séance découverte, qui est gratuite.
      accueil: true
    - q: Le paiement est-il sécurisé ?
      r: Oui. Il passe par HelloAsso, la plateforme de paiement des associations.
    - q: Pourquoi un collectif réservé aux femmes ?
      r: Pour créer un espace de confiance et encourager la place des femmes dans le sport.
    - q: Y a-t-il un âge minimum ?
      r: Oui. Le collectif est ouvert aux femmes majeures.
- groupe: La santé et les courses
  id: sante
  questions:
    - q: Faut-il un certificat médical ?
      r: Pas pour nos sorties. Pour les courses officielles, le Pass Prévention Santé de la FFA suffit (5 € par an, en ligne).
    - q: Les projets sont-ils compris dans l'adhésion ?
      r: L'accès aux projets, oui. Les dossards et l'hébergement se paient à part, à prix coûtant.
